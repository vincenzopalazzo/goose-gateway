[package]
name = "goose-gateway"
version = "0.2.0"
edition = "2021"
rust-version = "1.94.1"
description = "OpenAI-compatible HTTP gateway in front of goose: chat through any goose provider or subscription, and set providers up from a browser"
license = "MIT"
repository = "https://github.com/vincenzopalazzo/goose-gateway"
readme = "README.md"
keywords = ["goose", "openai", "xai", "grok", "gateway"]
publish = false

[[bin]]
name = "goose-gateway"
path = "src/main.rs"

[dependencies]
# goose is not on crates.io (that name is a load-testing tool), so pin the repo by revision.
goose = { git = "https://github.com/aaif-goose/goose", rev = "1ba8c9fc2b1fbaf8b55ba523265402090459d308", default-features = false }
goose-provider-types = { git = "https://github.com/aaif-goose/goose", rev = "1ba8c9fc2b1fbaf8b55ba523265402090459d308", default-features = false }
# Same major versions goose pins, so the shared types are one crate instance.
rmcp = { version = "3.0.0", default-features = false, features = ["client", "transport-child-process"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
# Replays a sign-in redirect to goose's localhost listener (plain http, loopback only).
reqwest = { version = "0.13", default-features = false }
url = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# goose's shell extension imports process_wrap::std::ProcessSession, which is gated behind
# this feature. Inside goose's workspace another member switches it on; as a plain dependency
# nothing does, so it must be enabled here for feature unification to pick it up.
process-wrap = { version = "9.1", features = ["process-session"] }

# goose's workspace patches these; a git dependency does not inherit [patch], so repeat them.
[patch.crates-io]
agent-client-protocol = { git = "https://github.com/agentclientprotocol/rust-sdk", rev = "c97a5203d3392f7f231514d84eea014f9f43e6fb" }
agent-client-protocol-http = { git = "https://github.com/agentclientprotocol/rust-sdk", rev = "c97a5203d3392f7f231514d84eea014f9f43e6fb" }

# Kept modest on purpose: `goose` is a very large crate, and thin LTO with a single codegen
# unit pushed peak memory past what a default Docker Desktop VM allows, killing rustc mid-build.
[profile.release]
strip = true
